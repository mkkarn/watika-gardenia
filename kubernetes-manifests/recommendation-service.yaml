apiVersion: apps/v1
kind: Deployment
metadata:
  name: recommendation-service
  namespace: restaurant-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: recommendation-service
  template:
    metadata:
      labels:
        app: recommendation-service
    spec:
      containers:
      - name: recommendation-service
        image: ghcr.io/mkkarn/watika-gardenia-recommendation-service:latest
        ports:
        - containerPort: 8080
---
apiVersion: v1
kind: Service
metadata:
  name: recommendation-service
  namespace: restaurant-app
spec:
  type: ClusterIP
  selector:
    app: recommendation-service
  ports:
  - port: 8080
    targetPort: 8080

