apiVersion: apps/v1
kind: Deployment
metadata:
  name: cart-service
  namespace: restaurant-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: cart-service
  template:
    metadata:
      labels:
        app: cart-service
    spec:
      containers:
      - name: cart-service
        image: ghcr.io/mkkarn/watika-gardenia-cart-service:latest
        ports:
        - containerPort: 8082
---
apiVersion: v1
kind: Service
metadata:
  name: cart-service
  namespace: restaurant-app
spec:
  type: ClusterIP
  selector:
    app: cart-service
  ports:
  - port: 8082
    targetPort: 8082

