apiVersion: kustomize.config.k8s.io/v1alpha1
kind: Component
patchesStrategicMerge:
- |-
  apiVersion: apps/v1
  kind: Deployment
  metadata:
    name: loadgenerator
    namespace: restaurant-app
  spec:
    replicas: 1
    template:
      spec:
        containers:
        - name: loadgenerator
          image: ghcr.io/mkkarn/watika-gardenia-loadgenerator:latest
          args: ["-c", "for i in {1..50}; do curl -s http://frontend; sleep 1; done"]

