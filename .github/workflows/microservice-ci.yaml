name: Microservices CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  build-test-deploy:
    runs-on: ubuntu-latest
    steps:
    - name: Checkout repo
      uses: actions/checkout@v3

    - name: Set up Docker
      uses: docker/setup-buildx-action@v2

    - name: Build & Push Images
      run: |
        docker build -t ghcr.io/mkkarn/watika-gardenia-frontend:latest ./src/frontend
        docker push ghcr.io/mkkarn/watika-gardenia-frontend:latest
        # repeat for other services...

    - name: Set up kubectl
      uses: azure/setup-kubectl@v3
      with:
        version: '1.29.0'

    - name: Set up Kustomize
      uses: imranismail/setup-kustomize@v2
      with:
        kustomize-version: '5.0.0'

    - name: Authenticate to AWS
      uses: aws-actions/configure-aws-credentials@v4
      with:
        aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws-region: ap-south-1

    - name: Smoke Test Overlay
      run: |
        kubectl apply -k kustomize/tests/
        sleep 60
        kubectl logs -n restaurant-app deploy/loadgenerator

    - name: Chaos Test Overlay
      run: |
        kubectl apply -k kustomize/tests/
        kubectl get pods -n restaurant-app
        # Verify order-service is scaled to 0

    - name: Deploy Base + Components
      if: github.ref == 'refs/heads/main'
      run: |
        kubectl apply -k kustomize/

