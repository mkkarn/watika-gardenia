apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: orders-db
  namespace: restaurant-app
spec:
  serviceName: orders-db
  replicas: 1
  selector:
    matchLabels:
      app: orders-db
  template:
    metadata:
      labels:
        app: orders-db
    spec:
      containers:
      - name: postgres
        image: postgres:15
        env:
        - name: POSTGRES_DB
          value: orders
        - name: POSTGRES_USER
          value: admin
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: orders-db-secret
              key: password
        ports:
        - containerPort: 5432
---
apiVersion: v1
kind: Service
metadata:
  name: orders-db
  namespace: restaurant-app
spec:
  type: ClusterIP
  selector:
    app: orders-db
  ports:
  - port: 5432
    targetPort: 5432

