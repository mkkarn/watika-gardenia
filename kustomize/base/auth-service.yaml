apiVersion: apps/v1
kind: Deployment
metadata:
  name: auth-service
  namespace: restaurant-app
spec:
  replicas: 2
  selector:
    matchLabels:
      app: auth-service
  template:
    metadata:
      labels:
        app: auth-service
    spec:
      containers:
      - name: auth-service
        image: ghcr.io/mkkarn/watika-gardenia-auth-service:latest
        ports:
        - containerPort: 8086
---
apiVersion: v1
kind: Service
metadata:
  name: auth-service
  namespace: restaurant-app
spec:
  type: ClusterIP
  selector:
    app: auth-service
  ports:
  - port: 8086
    targetPort: 8086

